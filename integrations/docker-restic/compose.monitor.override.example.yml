x-monitor-environment: &monitor-environment
  RESTIC_MONITOR_ENABLED: "1"
  RESTIC_MONITOR_REPOSITORY_KEY: ${RESTIC_MONITOR_REPOSITORY_KEY:?set a registered Repository key}
  RESTIC_MONITOR_API_URL: ${RESTIC_MONITOR_API_URL:?set the Worker base URL}
  RESTIC_MONITOR_TOKEN_FILE: /run/secrets/restic_monitor_token
  RESTIC_MONITOR_SPOOL_DIR: /var/lib/restic-monitor

services:
  backup:
    image: restic-monitor-docker:pilot
    environment:
      <<: *monitor-environment
      RESTIC_MONITOR_JOB_KEY: ${RESTIC_MONITOR_BACKUP_JOB_KEY:?set the registered backup Job key}
    volumes:
      - monitor-backup-spool:/var/lib/restic-monitor
    secrets:
      - restic_monitor_token

  prune:
    image: restic-monitor-docker:pilot
    environment:
      <<: *monitor-environment
      RESTIC_MONITOR_JOB_KEY: ${RESTIC_MONITOR_PRUNE_JOB_KEY:?set the registered prune Job key}
    volumes:
      - monitor-prune-spool:/var/lib/restic-monitor
    secrets:
      - restic_monitor_token

  check:
    image: restic-monitor-docker:pilot
    environment:
      <<: *monitor-environment
      RESTIC_MONITOR_JOB_KEY: ${RESTIC_MONITOR_CHECK_JOB_KEY:?set the registered check Job key}
    volumes:
      - monitor-check-spool:/var/lib/restic-monitor
    secrets:
      - restic_monitor_token

secrets:
  restic_monitor_token:
    file: ${RESTIC_MONITOR_SECRET_FILE:?set a protected file containing the Reporter token}

volumes:
  monitor-backup-spool:
  monitor-prune-spool:
  monitor-check-spool:
